name: Test project

on:
  push:
    branches:
    - '!master'
    - '**'

permissions:
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - '3.12.3'
          - '3.12.11'
          - '3.14'

    name: Python ${{ matrix.python-version }}

    steps:
    # v6 actions: updated deps, avoids node-tar CVE (Arbitrary File Read/Write via Hardlink)
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Setup CodeClimate
      continue-on-error: true
      env:
        CC_TEST_REPORTER_ID: ${{ secrets.CC_TEST_REPORTER_ID }}
      run: |
        if [ -n "$CC_TEST_REPORTER_ID" ]; then
          curl -fkLO https://github.com/codeclimate/test-reporter/releases/download/v0.11.1/artifacts.tar.gz
          tar xvf artifacts.tar.gz ./artifacts/bin/test-reporter-0.11.1-linux-amd64 --strip-components=3
          mv test-reporter-0.11.1-linux-amd64 cc-test-reporter
          ./cc-test-reporter before-build
        fi

    - name: Test package
      run: |
        py.test --cov poco --cov-report=xml

    - name: Upload coverage riport
      continue-on-error: true
      env:
        CC_TEST_REPORTER_ID: ${{ secrets.CC_TEST_REPORTER_ID }}
      run: |
        if [ -n "$CC_TEST_REPORTER_ID" ]; then ./cc-test-reporter after-build; fi
