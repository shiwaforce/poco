# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install build
    - name: Build package
      run: python -m build
    - name: Setup CodeClimate
      run: |
        curl -fkLO https://github.com/codeclimate/test-reporter/releases/download/v0.11.1/artifacts.tar.gz
        tar xvf artifacts.tar.gz ./artifacts/bin/test-reporter-0.11.1-linux-amd64 --strip-components=3
        mv test-reporter-0.11.1-linux-amd64 cc-test-reporter
        ./cc-test-reporter before-build
    - name: Test package
      run: |
        py.test --cov poco --cov-report=xml
    - name: Upload coverage to Code Climate (best-effort)
      continue-on-error: true
      env:
        CC_TEST_REPORTER_ID: 9d39e517e2a74afe27c5d9b783a86db53babf6c3bd498fab51605c661be3c271
      run: |
        ./cc-test-reporter after-build || true
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip-existing: true
